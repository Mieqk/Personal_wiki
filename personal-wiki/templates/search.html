{% extends "base.html" %}

{% block title %}🔍 Search - Personal Wiki{% endblock %}

{% block extra_head %}
<style>
    @keyframes fadeInUp {
        0% { transform: translateY(20px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    
    @keyframes slideIn {
        0% { transform: translateX(-20px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
    }
    
    .search-page-container {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 40px);
        animation: fadeInUp 0.6s ease-out;
    }
    
    .search-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-primary);
        animation: fadeInUp 0.6s ease-out 0.1s both;
    }
    
    .search-input-wrapper {
        position: relative;
        max-width: 720px;
        margin: 0 auto;
    }
    
    .search-input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 18px;
        pointer-events: none;
        transition: all 0.3s ease;
        animation: pulse 2s ease-in-out infinite;
    }
    
    .search-input:focus + .search-input-icon,
    .search-input:not(:placeholder-shown) + .search-input-icon {
        color: var(--accent-color);
    }
    
    .search-input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        font-size: 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text-primary);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: var(--font-family);
    }
    
    .search-input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        transform: translateY(-2px);
    }
    
    .search-input::placeholder {
        color: var(--text-muted);
        transition: opacity 0.3s ease;
    }
    
    .search-input:focus::placeholder {
        opacity: 0.5;
    }
    
    .search-results-container {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        animation: fadeInUp 0.6s ease-out 0.2s both;
    }
    
    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
    }
    
    .results-header h2 {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
    }
    
    .results-count {
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 500;
        transition: all 0.3s ease;
    }
    
    .results-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .result-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        animation: slideIn 0.4s ease-out both;
        position: relative;
        overflow: hidden;
    }
    
    .result-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.05), transparent);
        transition: left 0.5s ease;
    }
    
    .result-card:hover::before {
        left: 100%;
    }
    
    .result-card:hover {
        border-color: var(--accent-color);
        background: var(--card-hover-bg);
        transform: translateX(8px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
    }
    
    .result-card:nth-child(1) { animation-delay: 0.05s; }
    .result-card:nth-child(2) { animation-delay: 0.1s; }
    .result-card:nth-child(3) { animation-delay: 0.15s; }
    .result-card:nth-child(4) { animation-delay: 0.2s; }
    .result-card:nth-child(5) { animation-delay: 0.25s; }
    .result-card:nth-child(6) { animation-delay: 0.3s; }
    .result-card:nth-child(7) { animation-delay: 0.35s; }
    .result-card:nth-child(8) { animation-delay: 0.4s; }
    .result-card:nth-child(9) { animation-delay: 0.45s; }
    .result-card:nth-child(10) { animation-delay: 0.5s; }
    
    .result-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: var(--text-primary);
        transition: color 0.3s ease;
    }
    
    .result-title a {
        color: inherit;
        text-decoration: none;
    }
    
    .result-title a:hover {
        color: var(--accent-color);
    }
    
    .result-preview {
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin: 0 0 12px 0;
        transition: color 0.3s ease;
    }
    
    .result-card:hover .result-preview {
        color: var(--text-primary);
    }
    
    .result-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    
    .tag {
        background: var(--tag-bg);
        color: var(--accent-color);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid rgba(102, 126, 234, 0.2);
        transition: all 0.3s ease;
        animation: fadeInUp 0.3s ease-out both;
    }
    
    .tag:nth-child(1) { animation-delay: 0.1s; }
    .tag:nth-child(2) { animation-delay: 0.15s; }
    .tag:nth-child(3) { animation-delay: 0.2s; }
    
    .tag:hover {
        background: var(--accent-color);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
    }
    
    .no-results {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-muted);
        font-size: 0.9375rem;
        animation: fadeInUp 0.5s ease-out;
    }
    
    mark {
        background: linear-gradient(90deg, rgba(255, 184, 0, 0.3), rgba(255, 184, 0, 0.5), rgba(255, 184, 0, 0.3));
        background-size: 200% 100%;
        animation: shimmer 2s ease-in-out infinite;
        color: var(--text-primary);
        padding: 1px 4px;
        border-radius: 2px;
        font-weight: 500;
    }
    
    .loading-skeleton {
        background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--card-bg) 50%, var(--bg-secondary) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 8px;
        height: 60px;
        margin-bottom: 12px;
    }
</style>
{% endblock %}

{% block content %}
<div class="search-page-container">
    <header class="search-header">
        <div class="search-input-wrapper">
            <span class="search-input-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" data-translate-placeholder="searchPlaceholder" placeholder="Поиск страниц...">
        </div>
    </header>
    
    <div class="search-results-container">
        <div class="results-header">
            <h2 data-translate="searchResults">Результаты поиска</h2>
            <span id="resultsCount" class="results-count">0 найдено</span>
        </div>
        <div id="resultsList" class="results-list">
            <!-- Results will be populated here -->
        </div>
    </div>
</div>

<script>
    // Search data from template
    const searchData = {{ search_data_json | safe }};
    
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');
    
    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }
    
    function performSearch(query) {
        const normalizedQuery = query.toLowerCase().trim();
        
        if (normalizedQuery.length === 0) {
            resultsList.innerHTML = '<p class="no-results" data-translate="enterQuery">Enter a search query to find pages</p>';
            resultsCount.textContent = '0 найдено';
            return;
        }
        
        const results = searchData.filter(item => {
            return item.title.toLowerCase().includes(normalizedQuery) ||
                   item.content.toLowerCase().includes(normalizedQuery) ||
                   item.tags.some(tag => tag.toLowerCase().includes(normalizedQuery));
        });
        
        resultsCount.textContent = `${results.length} найдено`;
        
        if (results.length === 0) {
            resultsList.innerHTML = '<p class="no-results" data-translate="noResults">No results найдено</p>';
            return;
        }
        
        resultsList.innerHTML = results.map(item => `
            <div class="result-card" onclick="window.location.href='${item.slug}.html'">
                <h3 class="result-title">
                    <a href="${item.slug}.html">${highlightText(item.title, query)}</a>
                </h3>
                <p class="result-preview">${highlightText(item.content.substring(0, 200) + (item.content.length > 200 ? '...' : ''), query)}</p>
                ${item.tags.length > 0 ? `
                    <div class="result-tags">
                        ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                ` : ''}
            </div>
        `).join('');
    }
    
    searchInput.addEventListener('input', (e) => {
        performSearch(e.target.value);
    });
    
    // Initialize
    performSearch('');
    
    // Focus search input on page load
    window.addEventListener('load', () => {
        searchInput.focus();
    });
</script>
{% endblock %}
