<style>
    .search-page-container {
        display: flex;
        flex-direction: column;
        min-height: calc(100vh - 40px);
    }
    
    .search-header {
        padding: 24px;
        border-bottom: 1px solid var(--border-color);
        background: var(--bg-primary);
    }
    
    .search-input-wrapper {
        position: relative;
        max-width: 720px;
        margin: 0 auto;
    }
    
    .search-input-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 18px;
        pointer-events: none;
    }
    
    .search-input {
        width: 100%;
        padding: 14px 16px 14px 48px;
        font-size: 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--card-bg);
        color: var(--text-primary);
        transition: all 0.2s ease;
        font-family: var(--font-family);
    }
    
    .search-input:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .search-input::placeholder {
        color: var(--text-muted);
    }
    
    .search-results-container {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
    }
    
    .results-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-color);
    }
    
    .results-header h2 {
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0;
    }
    
    .results-count {
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 500;
    }
    
    .results-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    
    .result-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px 20px;
        transition: all 0.2s ease;
        cursor: pointer;
    }
    
    .result-card:hover {
        border-color: var(--accent-color);
        background: var(--card-hover-bg);
        transform: translateX(4px);
    }
    
    .result-title {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: var(--text-primary);
    }
    
    .result-title a {
        color: inherit;
        text-decoration: none;
    }
    
    .result-title a:hover {
        color: var(--accent-color);
    }
    
    .result-preview {
        font-size: 0.875rem;
        color: var(--text-secondary);
        line-height: 1.6;
        margin: 0 0 12px 0;
    }
    
    .result-tags {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    
    .tag {
        background: var(--tag-bg);
        color: var(--accent-color);
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid rgba(102, 126, 234, 0.2);
    }
    
    .no-results {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-muted);
        font-size: 0.9375rem;
    }
    
    mark {
        background: rgba(255, 184, 0, 0.3);
        color: var(--text-primary);
        padding: 1px 4px;
        border-radius: 2px;
        font-weight: 500;
    }
</style>

<div class="search-page-container">
    <header class="search-header">
        <div class="search-input-wrapper">
            <span class="search-input-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search pages...">
        </div>
    </header>
    
    <div class="search-results-container">
        <div class="results-header">
            <h2>Search Results</h2>
            <span id="resultsCount" class="results-count">0 found</span>
        </div>
        <div id="resultsList" class="results-list">
            <!-- Results will be populated here -->
        </div>

</div>

<script>
    // Search data from template
    const searchData = [{'slug': 'daily/2026-08-16', 'title': 'Daily Note 2026-08-16', 'content': "Daily Note - August 16, 2026\nToday's Focus\n\nComplete the Personal Wiki setup\nTest wiki links between pages\nWrite documentation\n\nNotes\nWorked on building the index page and linked it to Project Ideas.\nTasks Completed\n\n[x] Set up project structure\n[x] Create builder module\n[x] Add Markdown parsing\n[x] Implement wiki links\n[ ] Write tests\n\nReflections\nThe wiki is coming along nicely. Need to add search functionality next.\nSee also: Nonexistent Page - this should show as a broken link.", 'tags': ['daily', 'journal']}, {'slug': 'index', 'title': 'Welcome to Personal Wiki', 'content': 'Welcome to Your Personal Wiki! 🎉\nThis is your new local knowledge base built with Python and Markdown.\nFeatures\n\n✅ Markdown support - Write in familiar Markdown syntax\n🔗 Wiki links - Use Page Name to link between notes\n🏷️ Tags - Organize content with YAML frontmatter tags\n📁 Folder navigation - Automatic navigation from folder structure\n🌐 Static site generation - Fast, offline-first wiki\n\nGetting Started\n\nAdd your Markdown files to the notes/ folder\nRun python main.py build --source notes/ --outp', 'tags': ['welcome', 'getting-started']}, {'slug': 'project-ideas', 'title': 'Project Ideas', 'content': "Project Ideas 💡\nA collection of project ideas and brainstorming.\nWeb Projects\n\nPersonal wiki (this one!)\nTask manager with Pomodoro timer\nRecipe organizer with meal planning\n\nLearning Goals\n\nMachine Learning Basics - Want to learn more about ML\nWeb Development Notes - Collect web dev resources\nBuild a mobile app\n\nResources\nCheck out the index for getting started.\nNotes\n\nRemember: The best project is one you'll actually finish!\n\n\n[x] Set up wiki\n[ ] Add more ideas\n[ ] Start first project\n", 'tags': ['projects', 'ideas']}];
    
    const searchInput = document.getElementById('searchInput');
    const resultsList = document.getElementById('resultsList');
    const resultsCount = document.getElementById('resultsCount');
    
    function highlightText(text, query) {
        if (!query) return text;
        const regex = new RegExp(`(${query})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    }
    
    function performSearch(query) {
        const normalizedQuery = query.toLowerCase().trim();
        
        if (normalizedQuery.length === 0) {
            resultsList.innerHTML = '<p class="no-results">Enter a search query to find pages</p>';
            resultsCount.textContent = '0 found';
            return;
        }
        
        const results = searchData.filter(item => {
            return item.title.toLowerCase().includes(normalizedQuery) ||
                   item.content.toLowerCase().includes(normalizedQuery) ||
                   item.tags.some(tag => tag.toLowerCase().includes(normalizedQuery));
        });
        
        resultsCount.textContent = `${results.length} found`;
        
        if (results.length === 0) {
            resultsList.innerHTML = '<p class="no-results">No results found</p>';
            return;
        }
        
        resultsList.innerHTML = results.map(item => `
            <div class="result-card" onclick="window.location.href='${item.slug}.html'">
                <h3 class="result-title">
                    <a href="${item.slug}.html">${highlightText(item.title, query)}</a>
                </h3>
                <p class="result-preview">${highlightText(item.content.substring(0, 200) + (item.content.length > 200 ? '...' : ''), query)}</p>
                ${item.tags.length > 0 ? `
                    <div class="result-tags">
                        ${item.tags.map(tag => `<span class="tag">#${tag}</span>`).join('')}
                    </div>
                ` : ''}
            </div>
        `).join('');
    }
    
    searchInput.addEventListener('input', (e) => {
        performSearch(e.target.value);
    });
    
    // Initialize
    performSearch('');
    
    // Focus search input on page load
    window.addEventListener('load', () => {
        searchInput.focus();
    });
</script>
